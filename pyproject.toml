[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcook"
version = "0.1.0"
description = "食光 ShiGuang · 智能菜谱 Agent —— 输入食材,大模型决定做什么、怎么做"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
smartcook = "smartcook.cli:main"

[tool.setuptools]
packages = ["smartcook"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
